<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120b2e">
<title>Live Result – হকাই-এর ধন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4d8d;--vio:#7c5cff;--gold:#ffc857;--mut:rgba(255,255,255,.65);--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Hind Siliguri",system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 20% 0%,#4a1d9c 0,transparent 45%),radial-gradient(circle at 90% 30%,#a3195b 0,transparent 40%),linear-gradient(160deg,#120b2e,#2a1060);background-attachment:fixed;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 28px)}
.wrap{max-width:460px;margin:0 auto}
.hero{text-align:center;margin-bottom:16px}
h1{font-size:1.5rem;line-height:1.3;margin:4px 0 8px;background:linear-gradient(90deg,#fff,#ffd3e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border:1px solid var(--line);background:var(--glass);border-radius:99px;font-size:.8rem;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:#555}.live.on .dot{background:#3ee08f;box-shadow:0 0 0 0 rgba(62,224,143,.7);animation:pl 1.6s infinite}
@keyframes pl{to{box-shadow:0 0 0 10px rgba(62,224,143,0)}}
.tot{text-align:center;margin:16px 0 18px}.tot b{font-size:2.6rem;color:var(--gold);display:block;line-height:1}
.res{padding:14px;margin-bottom:12px;background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px)}
.top{display:flex;justify-content:space-between;gap:10px;font-weight:500;line-height:1.35}
.n{flex:none;color:var(--gold);font-weight:700}
.track{height:12px;margin-top:9px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--vio),var(--pink));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.res.lead{border-color:var(--gold)}.res.lead .track i{background:linear-gradient(90deg,var(--gold),#ff8a3d)}
.who{margin-top:8px;font-size:.85rem;color:var(--mut)}
.box{margin-top:16px;padding:14px;background:var(--glass);border:1px solid var(--line);border-radius:18px;font-size:.9rem;line-height:1.7}
.box b{display:block;margin-bottom:4px}
.chip{display:inline-block;padding:2px 10px;margin:2px;border-radius:99px;font-size:.82rem}
.ok{background:rgba(62,224,143,.18);color:#7dffbd}.wait{background:rgba(255,255,255,.1);color:var(--mut)}
.cta{display:block;text-align:center;margin-top:16px;padding:15px;color:#fff;font-weight:700;text-decoration:none;border-radius:16px;background:linear-gradient(90deg,var(--vio),var(--pink))}
.flash{animation:fs .8s}@keyframes fs{30%{transform:scale(1.03);border-color:var(--gold)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>🕵️ হকাই-এর ধন কে নিয়েছে??</h1><span class="live" id="live"><span class="dot"></span><span id="st">কানেক্ট হচ্ছে…</span></span></div>
  <div id="app"></div>
  <a class="cta" href="vote.html">🗳️ ভোট দিতে যাও</a>
</div>
<script>
/* ===== SETUP: vote.html এর সাথে একই URL ===== */
const FIREBASE_URL = "https://hokai-vote-default-rtdb.asia-southeast1.firebasedatabase.app";   // "https://your-project-default-rtdb.firebaseio.com"
const SHOW_WHO     = false; // true দিলে কে কাকে ভোট দিলো সেটাও দেখাবে
/* ========================================= */
const FRIENDS=["Sahin","Mubarak","Rahim","Kaif","Rohan","Sonil","Akash","Mija","Kamal","Raju","Majha","Aziz","Swapan","Sumon","Mimon","Abdar"];
const OPTS=["Rahim","Majha","Rohan","Sonil","Akash","কেসটা CBI এর উপরে ছেড়ে দেওয়া হোক, CBI এর সঠিক তদন্ত করবে!!"];
const app=document.getElementById("app"),DB=FIREBASE_URL.replace(/\/$/,"");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let prev=null;
function setLive(on){document.getElementById("live").classList.toggle("on",on);document.getElementById("st").textContent=on?"LIVE · নিজে নিজেই আপডেট হচ্ছে":"আবার কানেক্ট হচ্ছে…"}
function draw(v){
  const names=Object.keys(v),tot=names.length;
  const cnt=OPTS.map((_,i)=>names.filter(n=>v[n].c===i).length),max=Math.max(...cnt);
  const changed=prev&&prev.some((x,i)=>x!==cnt[i]);prev=cnt;
  app.innerHTML=`<div class="tot"><b>${tot}/${FRIENDS.length}</b>ভোট পড়েছে</div>`
   +OPTS.map((o,i)=>{const p=tot?Math.round(cnt[i]*100/tot):0;
     const who=SHOW_WHO&&cnt[i]?`<div class="who">${esc(names.filter(n=>v[n].c===i).join(", "))}</div>`:"";
     return `<div class="res ${tot&&cnt[i]===max?"lead":""} ${changed?"flash":""}"><div class="top"><span>${esc(o)}</span><span class="n">${cnt[i]} · ${p}%</span></div><div class="track"><i data-w="${p}"></i></div>${who}</div>`}).join("")
   +`<div class="box"><b>ভোট দিয়েছে ✅</b>${FRIENDS.filter(f=>f in v).map(f=>`<span class="chip ok">${f}</span>`).join("")||"<span class='who'>এখনও কেউ না</span>"}<b style="margin-top:10px">বাকি ⏳</b>${FRIENDS.filter(f=>!(f in v)).map(f=>`<span class="chip wait">${f}</span>`).join("")||"<span class='who'>কেউ বাকি নেই 🎉</span>"}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll(".track i").forEach(e=>e.style.width=e.dataset.w+"%")));
}
async function refresh(){try{draw((await (await fetch(DB+"/voters.json")).json())||{});setLive(true)}catch(e){setLive(false)}}
if(!DB){app.innerHTML=`<div class="res"><b>⚙️ Setup বাকি</b><div class="who">ফাইলে FIREBASE_URL বসাওনি।</div></div>`}
else{
  refresh();
  const es=new EventSource(DB+"/voters.json");           // Firebase থেকে instant খবর
  es.addEventListener("put",refresh);es.addEventListener("patch",refresh);
  es.onerror=()=>setLive(false);
  setInterval(refresh,15000);                              // backup
}
</script>
</body>
</html>
